---
layout: default
title: "音乐搜索"
---

<style>
  .search-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .search-box input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #1e1e1e;
    color: #eee;
    outline: none;
  }
  .search-box input[type="text"]:focus {
    border-color: #58a6ff;
  }
  .search-box select {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #1e1e1e;
    color: #eee;
    cursor: pointer;
  }
  .search-box button {
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #58a6ff;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .search-box button:hover {
    background: #79b8ff;
  }
  .search-box button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
  .results-info {
    color: #8b949e;
    margin: 16px 0 8px;
    font-size: 14px;
  }
  .song-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .song-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #2d2d2d;
    transition: background 0.15s;
  }
  .song-item:hover {
    background: #1a1a2e;
  }
  .song-title {
    font-weight: 600;
    color: #e6edf3;
  }
  .song-artist {
    color: #8b949e;
    font-size: 14px;
    margin-top: 2px;
  }
  .song-link {
    white-space: nowrap;
    margin-left: 16px;
  }
  .song-link a {
    display: inline-block;
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid #444;
    border-radius: 4px;
    color: #58a6ff;
    text-decoration: none;
    transition: all 0.15s;
  }
  .song-link a:hover {
    background: #58a6ff;
    color: #fff;
    border-color: #58a6ff;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #8b949e;
  }
  .loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #333;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .error-msg {
    color: #f85149;
    padding: 16px;
    background: #1e1011;
    border-radius: 6px;
    margin: 16px 0;
  }
  .empty-msg {
    text-align: center;
    padding: 40px;
    color: #8b949e;
  }
  .hint {
    color: #8b949e;
    font-size: 13px;
    margin-top: 8px;
  }
  .num {
    display: inline-block;
    width: 28px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    background: #2d2d2d;
    color: #8b949e;
    border-radius: 4px;
    font-size: 13px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .song-info {
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .song-meta {
    min-width: 0;
  }
</style>

<div class="search-box">
  <input type="text" id="keyword" placeholder="输入歌名或歌手名..." autofocus>
  <button id="searchBtn" onclick="doSearch()">搜索</button>
</div>
<p class="hint">点击搜索后会在新标签页打开对应网站的搜索结果页，直接在那边下载。</p>

<div class="source-links" id="sourceLinks" style="display:none; margin-top: 24px;">
  <p class="results-info" id="linksTitle"></p>
  <ul class="song-list" id="linksList"></ul>
</div>

<script>
const SOURCES = [
  { name: '歌曲吧', url: (kw) => `https://www.gequbao.com/s/${encodeURIComponent(kw)}` },
  { name: '鲸音无损', url: (kw) => `https://www.jywav.com/search?keyword=${encodeURIComponent(kw)}` },
  { name: '泡椒音乐', url: (kw) => `https://www.pjmp3.com/search?keyword=${encodeURIComponent(kw)}` },
];

const $ = (id) => document.getElementById(id);

$('keyword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch();
});

function doSearch() {
  const keyword = $('keyword').value.trim();
  if (!keyword) return;

  const linksList = $('linksList');
  const linksTitle = $('linksTitle');
  const sourceLinks = $('sourceLinks');

  linksTitle.textContent = `"${keyword}" 的搜索链接：`;
  linksList.innerHTML = '';

  SOURCES.forEach((source) => {
    const li = document.createElement('li');
    li.className = 'song-item';
    li.innerHTML = `
      <div class="song-info">
        <div class="song-meta">
          <div class="song-title">${source.name}</div>
        </div>
      </div>
      <div class="song-link"><a href="${escAttr(source.url(keyword))}" target="_blank" rel="noopener">去搜索</a></div>`;
    linksList.appendChild(li);
  });

  sourceLinks.style.display = 'block';
}

function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
